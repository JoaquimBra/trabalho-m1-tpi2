<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="./../../logo-livraria.png" type="image/png" />
  <link rel="stylesheet" href="./../../style.css" />
  <title>Cadastro Autor</title>
</head>

<body class="auth-carregando">
  <header class="cabecalho">
    <h1>Cadastro Autor</h1>
    <img src="./../../logo-livraria.png" alt="Logo da livraria" />
  </header>

  <nav class="navegacao">
    <a href="./../../index.html">Voltar para página inicial</a>
  </nav>

  <main class="conteudo">
    <section class="secao-conteudo-main">
      <button type="button" class="botao-abrir-modal" data-abrir="modal">
        Cadastrar Autor
      </button>
      <button type="button" class="botao-abrir-modal" id="btn-pesquisar" data-abrir="modal-lista">
        Ver Autores
      </button>
    </section>

    <dialog class="modal" id="modal" aria-labelledby="titulo-modal">
      <div class="modal-cabecalho">
        <h2 class="titulo-formulario" id="titulo-modal">Dados do Autor</h2>
        <button type="button" class="botao-fechar-modal" id="fechar-modal" aria-label="Fechar">&times;</button>
      </div>

      <form class="formulario" id="cadastro">
        <label for="nome"><em>Nome Completo:</em></label>
        <input type="text" name="nome" id="nome" />

        <label for="nacionalidade"><em>Nacionalidade:</em></label>
        <input type="text" name="nacionalidade" id="nacionalidade" />

        <label for="dataNasc"><em>Data de Nascimento:</em></label>
        <input type="date" name="dataNasc" id="dataNasc" />

        <label for="bibliografia"><em>Resumo das Obras:</em></label>
        <textarea name="bibliografia" id="bibliografia" rows="3"></textarea>

        <label for="genero"><em>Gênero Literário Principal:</em></label>
        <input type="text" name="genero" id="genero" />

        <input type="submit" value="Cadastrar" class="botao-enviar" />
      </form>
    </dialog>

    <dialog class="modal modal-largo" id="modal-lista" aria-labelledby="titulo-lista">
      <div class="modal-cabecalho">
        <h2 class="titulo-formulario titulo-listagem" id="titulo-lista">Autores Cadastrados</h2>
        <button type="button" class="botao-fechar-modal" data-fechar aria-label="Fechar">&times;</button>
      </div>

      <div class="tabela-wrapper">
        <table class="form-table" id="tabela">
          <thead>
            <tr>
              <th>Id</th>
              <th>Autor</th>
              <th>Nacionalidade</th>
              <th>Data de Nascimento</th>
              <th>Resumo das Obras</th>
              <th>Gênero Literário</th>
              <th>Editar</th>
              <th>Excluir</th>
            </tr>
          </thead>
          <tbody id="corpoTabela"></tbody>
        </table>
        <p class="tabela-vazia" id="tabela-vazia">Nenhum Autor cadastrado.</p>
      </div>
    </dialog>
  </main>

  <footer class="rodape">
    <p><strong>© 2026 - Projeto Livraria</strong></p>
  </footer>

  <script src="./../login/sessao.js" data-login="./../login/"></script>
  <script src="./autor.js"></script>
</body>

</html>
