<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="./../../logo-livraria.png" type="image/png" />
  <link rel="stylesheet" href="./../../style.css" />
  <title>Cadastro de Usuário - Livraria</title>
</head>

<body>
  <header class="cabecalho">
    <h1>Livraria</h1>
    <img src="./../../logo-livraria.png" alt="Logo da livraria" />
  </header>

  <main class="conteudo">
    <section class="secao-formulario">
      <h2 class="titulo-formulario">Criar Conta</h2>

      <form class="formulario" id="form-cadastro" method="POST">
        <input type="hidden" name="acao" value="cadastro" />

        <label for="nome"><em>Nome Completo:</em></label>
        <input type="text" name="nome" id="nome" placeholder="Seu nome completo" required />

        <label for="email"><em>E-mail:</em></label>
        <input type="email" name="email" id="email" placeholder="exemplo@email.com" required />

        <label for="senha"><em>Senha:</em></label>
        <input type="password" name="senha" id="senha" placeholder="Mínimo 6 caracteres" minlength="6" required />

        <label for="confirmarSenha"><em>Confirmar Senha:</em></label>
        <input type="password" name="confirmarSenha" id="confirmarSenha" placeholder="Repita sua senha" minlength="6" required />

        <input type="submit" value="Cadastrar" class="botao-enviar" />
      </form>

      <p class="link-auth">
        Já possui uma conta? <a href="./login.html">Fazer login</a>
      </p>
    </section>
  </main>

  <footer class="rodape">
    <p><strong>© 2026 - Projeto Livraria</strong></p>
  </footer>

  <script src="./login.js"></script>
</body>

</html>
