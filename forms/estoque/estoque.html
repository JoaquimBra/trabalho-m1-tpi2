<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./../../logo-livraria.png" type="image/png">
    <link rel="stylesheet" href="./../../style.css">
    <title>Cadastro Estoque</title>
</head>

<body>

    <header class="cabecalho">
        <h1>Cadastro Estoque</h1>
        <img src="./../../logo-livraria.png" alt="Logo da livraria">
    </header>

    <nav class="navegacao">
        <a href="./../../index.html">Voltar para página inicial</a>
    </nav>

    <main class="conteudo">
        <section class="secao-conteudo-main">
            <button type="button" class="botao-abrir-modal" data-abrir="modal">
                Cadastrar Estoque
            </button>
            <button type="button" class="botao-abrir-modal" id="btn-pesquisar" data-abrir="modal-lista">
                Ver Estoques
            </button>
        </section>

        <dialog class="modal" id="modal" aria-labelledby="titulo-modal">
            <div class="modal-cabecalho">
                <h2 class="titulo-formulario" id="titulo-modal">Dados do Estoque</h2>
                <button type="button" class="botao-fechar-modal" id="fechar-modal" aria-label="Fechar">&times;</button>
            </div>
            <section class="secao-formulario">
                <form class="formulario" id="cadastro" method="POST">

                    <label for="tituloLivro"><em>Titulo do livro:</em></label>
                    <input type="text" name="tituloLivro" id="tituloLivro">

                    <label for="isbn"><em>ISBN:</em></label>
                    <input type="text" name="isbn" id="isbn" placeholder="Ex: 978-85-7522-000-0" maxlength="17">

                    <label for="quantidadeAtual"><em>Quantidade Atual:</em></label>
                    <input type="number" name="quantidadeAtual" id="quantidadeAtual" min="0">

                    <label for="quantidadeMinima"><em>Quantidade Mínima (Alerta de Reposição):</em></label>
                    <input type="number" name="quantidadeMinima" id="quantidadeMinima" min="0">

                    <label for="localizacao"><em>Localização (Corredor, Estante, Prateleira):</em></label>
                    <input type="text" name="localizacao" id="localizacao">

                    <label for="dataReposicao"><em>Data da Última Reposição:</em></label>
                    <input type="date" name="dataReposicao" id="dataReposicao">

                    <label for="custoUnitario"><em>Custo Unitário de Aquisição (R$):</em></label>
                    <input type="number" name="custoUnitario" id="custoUnitario" min="0" step="0.01" placeholder="0.00">

                    <input type="submit" value="Cadastrar" class="botao-enviar">
                </form>
            </section>

        </dialog>

        <dialog class="modal modal-largo" id="modal-lista" aria-labelledby="titulo-lista">
            <div class="modal-cabecalho">
                <h2 class="titulo-formulario titulo-listagem" id="titulo-lista">Estoques Cadastrados</h2>
                <button type="button" class="botao-fechar-modal" data-fechar aria-label="Fechar">&times;</button>
            </div>

            <div class="tabela-wrapper">
                <table class="form-table" id="tabela">
                    <thead>
                        <tr>
                            <th>Id</th>
                            <th>Titulo Livro</th>
                            <th>ISBN</th>
                            <th>Quantidade Atual</th>
                            <th>Quantidade Mínima</th>
                            <th>Localização</th>
                            <th>Data Reposição</th>
                            <th>Custo Unitário (R$)</th>
                            <th>Editar</th>
                            <th>Excluir</th>
                        </tr>
                    </thead>
                    <tbody id="corpoTabela">
                        <!-- Exemplo de linha (pode apagar):
                        <tr>
                            <td>1</td>
                            <td>Livro Exemplo</td>
                            <td>978-85-7522-000-0</td>
                            <td>10</td>
                            <td>5</td>
                            <td>Corredor A, Estante 1, Prateleira 2</td>
                            <td>2023-01-15</td>
                            <td>29.90</td>
        -->
                    </tbody>
                </table>
                <p class="tabela-vazia" id="tabela-vazia">Nenhum Estoque cadastrado.</p>
            </div>
        </dialog>
    </main>

    <footer class="rodape">
        <p><strong>© 2026 - Projeto Livraria</strong></p>
    </footer>
    <script src="./estoque.js"></script>
</body>

</html>
