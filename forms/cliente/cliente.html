<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="./../../logo-livraria.png" type="image/png" />
  <link rel="stylesheet" href="./../../style.css" />
  <title>Cadastro Cliente</title>
</head>

<body>
  <header class="cabecalho">
    <h1>Cadastro Cliente</h1>
    <img src="./../../logo-livraria.png" alt="Logo da livraria" />
  </header>

  <nav class="navegacao">
    <a href="./../../index.html">Voltar para página inicial</a>
  </nav>

  <main class="conteudo">
    <section class="secao-conteudo-main">
      <button type="button" class="botao-abrir-modal" data-abrir="modal">
        Cadastrar Cliente
      </button>
      <button type="button" class="botao-abrir-modal" id="btn-pesquisar" data-abrir="modal-lista">
        Ver Clientes
      </button>
    </section>

    <dialog class="modal" id="modal" aria-labelledby="titulo-modal">
      <div class="modal-cabecalho">
        <h2 class="titulo-formulario" id="titulo-modal">Dados do Cliente</h2>
        <button type="button" class="botao-fechar-modal" id="fechar-modal" aria-label="Fechar">&times;</button>
      </div>

      <form class="formulario" id="cadastro">
        <label for="nome"><em>Nome Completo:</em></label>
        <input type="text" name="nome" id="nome" placeholder="Nome e Sobrenome" />

        <label for="dataNasc"><em>Data de Nascimento:</em></label>
        <input type="date" name="dataNasc" id="dataNasc" />

        <label for="cpf"><em>CPF:</em></label>
        <input type="text" name="cpf" id="cpf" placeholder="000.000.000-00" maxlength="14" />

        <label for="email"><em>E-mail:</em></label>
        <input type="text" name="email" id="email" placeholder="exemplo@email.com" />

        <label for="telefone"><em>Telefone:</em></label>
        <input type="tel" name="telefone" id="telefone" placeholder="987458855" maxlength="9" />

        <label for="endereco"><em>Endereço:</em></label>
        <input type="text" name="endereco" id="endereco" placeholder="Rua, Número, Bairro" maxlength="100" />

        <input type="submit" value="Cadastrar" class="botao-enviar" />
      </form>
    </dialog>
      
    <dialog class="modal modal-largo" id="modal-lista" aria-labelledby="titulo-lista">
      <div class="modal-cabecalho">
        <h2 class="titulo-formulario titulo-listagem" id="titulo-lista">Clientes Cadastrados</h2>
        <button type="button" class="botao-fechar-modal" data-fechar aria-label="Fechar">&times;</button>
      </div>

      <div class="tabela-wrapper">
        <table class="form-table" id="tabela">
          <thead>
            <tr>
              <th>Id</th>
              <th>Cliente</th>
              <th>CPF</th>
              <th>Data de Nascimento</th>
              <th>E-mail</th>
              <th>Telefone</th>
              <th>Endereço</th>
              <th>Editar</th>
              <th>Excluir</th>
            </tr>
          </thead>
          <tbody id="corpoTabela">
            <!-- Exemplo de linha (pode apagar):
        <tr>
          <td>1</td>
          <td>João Silva</td>
          <td>000.000.000-00</td>
          <td>01/01/1990</td>
          <td>joao.silva@email.com</td>
          <td>987654321</td>
          <td>Rua Exemplo, 123</td>
        </tr>
        -->
          </tbody>
        </table>
        <p class="tabela-vazia" id="tabela-vazia">Nenhum Cliente cadastrado.</p>
      </div>
    </dialog>

  </main>

  <footer class="rodape">
    <p><strong>© 2026 - Projeto Livraria</strong></p>
  </footer>

  <script src="./cliente.js"></script>
</body>

</html>
